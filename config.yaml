# GOPS COMPUTATION PARAMETERS (OFDM / baseband processing)
gops_params:
  T_s: 0.00007143          # OFDM symbol period (s) — 30 kHz SCS, 20 MHz
  N_DFT: 2048              # FFT size
  N_used: 1200             # Used subcarriers (20 MHz)
  f_s: 30720000.0          # Sampling rate (Hz) — 30.72 MHz

comm_energy_params:
  # CPU (centralized combining)
  C_max_cpu_GOPS: 360       # CPU processor capacity (GOPS)
  P_static_cpu_W: 41.6      # CPU static power (W)
  slope_power_cpu_W: 148.0   # CPU load-dependent slope (W)
  # AP (filtering + DFT + CE)
  C_max_ap_GOPS: 180        # AP processor capacity (GOPS)
  P_static_ap_W: 20.8       # AP static power (W)
  slope_power_ap_W: 74.0    # AP load-dependent slope (W)

# ANTENNA POWER PARAMETERS
antenna_power_params:
  P_antenna_W: 6.8          # Power per antenna (Watts)
  sleep_fraction: 0.1       # Sleep-mode power as a fraction of active draw

# EVALUATION PARAMETERS
# Used to score a split vector: fitness = energy + lambda_penalty * (deadline violation seconds).
evaluation:
  lambda_penalty: 2000.0     # penalty coefficient λ (J per second of deadline violation)
